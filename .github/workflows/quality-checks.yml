name: Hub and video quality
on:
  push:
    branches: [main, feature/brand-video-quality]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --ignore-scripts
      - name: Install Chromium
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Logic and export lifecycle
        id: logic
        run: node tests/ci-runner.cjs test test:export test:render test:dom
      - name: 'Logic result: ${{ steps.logic.outputs.detail }}'
        if: always()
        run: echo 'Logic checks finished.'
      - name: Browser workspace and timeline
        id: browser
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/ci-runner.cjs test:browser:hub test:browser:notes test:browser:timeline
      - name: 'Browser result: ${{ steps.browser.outputs.detail }}'
        if: always()
        run: echo 'Browser checks finished.'
      - name: Real video and audio export
        id: video
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: node tests/ci-runner.cjs test:browser:export
      - name: 'Video result: ${{ steps.video.outputs.detail }}'
        if: always()
        run: echo 'Video export check finished.'
      - name: Independently decode exported video
        id: fileverify
        if: ${{ !cancelled() && hashFiles('tests/artifacts/video-export-sample.*') != '' }}
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          node tests/ci-runner.cjs test:video:file
      - name: 'File result: ${{ steps.fileverify.outputs.detail }}'
        if: always()
        run: echo 'Independent file verification finished.'
      - name: Save screenshots and export samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hub-video-verification
          path: tests/artifacts/
          if-no-files-found: ignore
